name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Unit tests with coverage
        run: |
          set -o pipefail
          # Failures are also reported as annotations, so they show up on the commit and the pull request.
          ./scripts/coverage.sh 2>&1 | tee test.log || {
            grep -E "error:|failed|Fatal|fatal error" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Translations complete in all 15 languages
        run: python3 scripts/check-strings.py

      - name: Build the signed app bundle (ad hoc)
        run: ./scripts/build-local.sh --no-install

      - name: Signed app has the sandbox and no network entitlement
        run: |
          APP="dist/Kapture SCR.app"
          codesign -d --entitlements :- "$APP" > entitlements.plist
          cat entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' entitlements.plist | grep -qx true
          if grep -q 'com.apple.security.network' entitlements.plist; then
            echo "::error::The signed app has a network entitlement"; exit 1
          fi
